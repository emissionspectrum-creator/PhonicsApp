<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhonicsApp</title>
<style>
  @font-face {
    font-family: 'Lexend';
    src: url('/fonts/Lexend-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Lexend';
    src: url('/fonts/Lexend-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f7f1e6;
    --tile-bg: #fffaf0;
    --tile-shadow: 0 3px 8px rgba(60, 45, 20, 0.14);
    --consonant-color: #3a3226;
    --vowel-color: #c0392b;
    --placeholder-border: #d8cdb8;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--consonant-color);
    font-family: 'Lexend', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    height: 100vh;
    width: 100vw;
    display: grid;
    grid-template-rows: 10% 60% 30%;
  }

  /* 上帶 */
  #top-bar {
    display: flex;
    align-items: center;
    padding: 0 28px;
  }
  #stage-select, #family-select {
    font-family: inherit;
    font-size: 13px;
    color: #b8ad98;
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
  }
  #stage-select:hover, #family-select:hover { color: #8a7f6a; }

  /* 中帶 */
  #stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    overflow: hidden;
  }

  #puzzle {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    transition: transform 400ms ease-out;
  }
  #stage.solved #puzzle {
    transform: translateY(20vh);
  }

  .letter-slot, .letter-tile {
    width: 13vw;
    height: 13vw;
    max-width: 170px;
    max-height: 170px;
    margin: 0 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7vw;
    font-weight: 700;
    border-radius: var(--radius);
    background: var(--tile-bg);
    box-shadow: var(--tile-shadow);
  }

  .letter-slot.placeholder {
    background: rgba(0, 0, 0, 0.03);
    border: 3px dashed var(--placeholder-border);
    box-shadow: none;
  }

  .gap-spacer {
    width: 6vw;
    flex-shrink: 0;
    transition: width 300ms ease-out;
  }
  .gap-spacer.collapsed { width: 0; }

  @keyframes bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  #puzzle.bounce .letter-slot,
  #puzzle.bounce .letter-tile {
    animation: bounce 120ms ease-out;
  }

  #replay-btn {
    position: absolute;
    right: 6%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--tile-bg);
    box-shadow: var(--tile-shadow);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #replay-btn svg { width: 28px; height: 28px; fill: var(--consonant-color); }

  .nav-btn {
    position: absolute;
    top: 50%;
    z-index: 3;
    height: 48px;
    padding: 0 22px;
    border-radius: 24px;
    background: var(--tile-bg);
    box-shadow: var(--tile-shadow);
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 17px;
    color: var(--consonant-color);
    white-space: nowrap;
  }
  /* 與重播鍵同軸,置於其下方 */
  #next-btn { right: calc(6% + 32px); transform: translate(50%, 48px); }
  /* 左側鏡像等高位 */
  #prev-btn { left: calc(6% + 32px); transform: translate(-50%, 48px); }
  .nav-btn:disabled {
    opacity: 0.22;
    cursor: default;
    box-shadow: none;
  }

  /* 圖片一律 1024×1024,容器做成正方形,右上角才會貼齊圖的右上角 */
  #reveal {
    position: absolute;
    top: 0;
    left: 50%;
    z-index: 1;
    height: 62%;
    aspect-ratio: 1;
    transform: translate(-50%, 60vh);
    transition: transform 400ms ease-out;
  }
  #stage.solved #reveal {
    transform: translate(-50%, 0);
  }
  #reveal.no-anim { transition: none; }
  #reveal-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* 給大人看的字義註記:低對比、小尺寸,停留 0.4 秒才浮現 */
  #reveal-note {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 15px;
    color: #b8ad98;
    pointer-events: none;
    opacity: 0;
    transition: opacity 180ms ease 0s;
  }
  #reveal:hover #reveal-note {
    opacity: 1;
    transition-delay: 400ms;
  }

  /* 下帶 */
  #options-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5vw;
    height: 100%;
  }
  #options-row.locked .option-tile { pointer-events: none; }

  .option-tile {
    width: 9vw;
    height: 9vw;
    max-width: 110px;
    max-height: 110px;
    border: none;
    border-radius: var(--radius);
    background: var(--tile-bg);
    box-shadow: var(--tile-shadow);
    font-family: 'Lexend', sans-serif;
    font-weight: 700;
    font-size: 4.5vw;
    color: var(--consonant-color);
    cursor: pointer;
    transition: transform 150ms ease, box-shadow 150ms ease;
  }
  .option-tile:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(60, 45, 20, 0.18);
  }

  @keyframes fadeWrong {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .option-tile.fade-wrong { animation: fadeWrong 400ms ease; }

  @keyframes fadeOut {
    to { opacity: 0; transform: scale(0.9); }
  }
  .option-tile.fade-out { animation: fadeOut 300ms ease forwards; }

  #min-height-warning {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 24px;
    color: var(--consonant-color);
  }
  #min-height-warning.visible { display: flex; }
</style>
</head>
<body>

<div id="min-height-warning">請將視窗放大,或按 F11 全螢幕使用</div>

<div id="app">
  <header id="top-bar">
    <select id="stage-select"></select>
    <select id="family-select"></select>
  </header>

  <main id="stage">
    <div id="puzzle"></div>
    <button id="replay-btn" aria-label="重播">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <button id="prev-btn" class="nav-btn" disabled>上一頁</button>
    <button id="next-btn" class="nav-btn" disabled>下一頁</button>
    <div id="reveal">
      <img id="reveal-image" alt="">
      <span id="reveal-note"></span>
    </div>
  </main>

  <footer id="options-row"></footer>
</div>

<audio id="audio-player"></audio>

<script>
  const VOWELS = ['a', 'e', 'i', 'o', 'u'];
  const MIN_HEIGHT = 700;
  const CONTRAST_STAGE = 6;
  const MIN_CONTRAST_SIZE = 3;
  const RIME_MODE_STAGES = new Set([7, 8, 9, 10, 11]);  // 挖整塊 rime 的階段(見 HANDOFF.md §B2)
  const MIN_SESSION_POOL = 2;  // 選單收錄門檻:候選池不足 2 字組不成選項

  let words = [];
  let contrastSets = new Map();
  let session = null;
  let solved = false;
  let roundToken = 0;  // 翻頁時作廢上一題還在等待中的圖片顯示

  function isVowel(ch) {
    return VOWELS.includes(ch.toLowerCase());
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sample(arr, n) {
    return shuffle(arr).slice(0, n);
  }

  function checkMinHeight() {
    document.getElementById('min-height-warning')
      .classList.toggle('visible', window.innerHeight < MIN_HEIGHT);
  }

  function letters(w, wholeRime) {
    return wholeRime ? [w.onset, w.rime] : [w.onset, ...w.rime];
  }

  // 一格可能不只一個字母(ick),逐字母上色
  function paintUnit(el, unit) {
    el.textContent = '';
    for (const ch of unit) {
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.color = isVowel(ch) ? 'var(--vowel-color)' : 'var(--consonant-color)';
      el.appendChild(span);
    }
  }

  // 寬度隨字母數長,高度不變。單字母時不覆寫,樣式完全同以往
  const UNIT_SIZE = { slot: [13, 4.2, 170, 55], option: [9, 2.6, 110, 34] };
  function sizeUnit(el, len, kind) {
    if (len <= 1) return;
    const [vw, dvw, px, dpx] = UNIT_SIZE[kind];
    el.style.width = `calc(${vw}vw + ${((len - 1) * dvw).toFixed(1)}vw)`;
    el.style.maxWidth = `${px + (len - 1) * dpx}px`;
  }

  // 母音字母段 / 尾子音段。比的是字母不是音值:cap 與 cape 同屬母音段 a
  function rimeParts(w) {
    let i = 0;
    while (i < w.rime.length && isVowel(w.rime[i])) i++;
    return [w.rime.slice(0, i), w.rime.slice(i)];
  }

  // 挖 onset 時的第 1 層:onset 是 target onset 的單一成分(stop → top、swing → sing/wing),
  // 不問階段。target 是單字母 onset 時必然為空,階段 1-5 因此與改版前完全相同
  function onsetComponents(target, others) {
    return others.filter((w) => w.onset.length === 1
      && target.onset.length > 1 && target.onset.includes(w.onset));
  }

  // 挖 rime 時的第一層是教學點:同母音、異尾子音(sick → sit/sing/sink),不問階段
  function rankDistractors(target, others) {
    const [vowel, coda] = rimeParts(target);
    const tiers = [[], [], []];
    for (const w of others) {
      const [v, c] = rimeParts(w);
      if (v === vowel && c !== coda) tiers[0].push(w);
      else if (Number(w.stage) === Number(target.stage)) tiers[1].push(w);
      else tiers[2].push(w);
    }
    return tiers.flatMap(shuffle);
  }

  function buildContrastSets() {
    const sets = new Map();
    for (const w of words) {
      if (w.rime.length > 1 && isVowel(w.rime[1])) continue; // 母音組合(ai/ee/oa…)不做單母音對比
      const key = `${w.onset}_${w.rime.slice(1)}`;
      if (!sets.has(key)) sets.set(key, []);
      sets.get(key).push(w);
    }
    for (const [key, group] of sets) {
      if (group.length < MIN_CONTRAST_SIZE) sets.delete(key);
    }
    return new Map([...sets].sort((a, b) => a[0].localeCompare(b[0])));
  }

  function isContrastStage(stage) {
    return String(stage) === String(CONTRAST_STAGE);
  }

  // 選單值:「-ack」是字族(挖 onset),「s-」是開頭音(挖整塊 rime)
  function isRimeMode(stage, name) {
    return RIME_MODE_STAGES.has(Number(stage)) && name.endsWith('-');
  }

  function buildStageSelect() {
    const stages = new Set(words.map((w) => w.stage));
    stages.add(CONTRAST_STAGE);
    const select = document.getElementById('stage-select');
    select.innerHTML = '';
    for (const stage of [...stages].sort((a, b) => a - b)) {
      const opt = document.createElement('option');
      opt.value = stage;
      opt.textContent = `階段 ${stage}`;
      select.appendChild(opt);
    }
  }

  function addOptionGroup(select, names, groupLabel) {
    const parent = groupLabel ? document.createElement('optgroup') : select;
    if (groupLabel) parent.label = groupLabel;
    for (const name of names) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      parent.appendChild(opt);
    }
    if (groupLabel) select.appendChild(parent);
  }

  function buildFamilySelect(stage) {
    const select = document.getElementById('family-select');
    select.innerHTML = '';
    if (isContrastStage(stage)) {
      addOptionGroup(select, [...contrastSets.keys()]);
      return;
    }
    const inStage = words.filter((w) => String(w.stage) === String(stage));
    // 同字族(含 stage 較小的舊字)不足 2 字者不列,選了也開不了 session,例如階段九的 -umb
    const families = [...new Set(inStage.map((w) => w.family))]
      .filter((f) => words.filter((w) => w.family === f && w.stage <= Number(stage))
        .length >= MIN_SESSION_POOL)
      .sort();
    if (!RIME_MODE_STAGES.has(Number(stage))) {
      addOptionGroup(select, families);
      return;
    }
    // 零 onset(ink)沒有開頭音可選,只從字族進去;
    // 同 onset(含 stage 較小的舊字)不足 2 字者不列,例如階段八的 sw-、pl-
    const onsets = [...new Set(inStage.filter((w) => w.onset).map((w) => w.onset))]
      .filter((o) => words.filter((w) => w.onset === o && w.stage <= Number(stage))
        .length >= MIN_SESSION_POOL)
      .sort().map((o) => `${o}-`);
    addOptionGroup(select, families, '字族(比開頭音)');
    addOptionGroup(select, onsets, '開頭音(比字尾)');
  }

  function playWord(wordObj, onEnded) {
    const audio = document.getElementById('audio-player');
    audio.pause();
    audio.src = `/assets/audio/${wordObj.word}.mp3`;
    audio.currentTime = 0;
    if (onEnded) {
      audio.addEventListener('ended', onEnded, { once: true });
      audio.addEventListener('error', onEnded, { once: true });
    }
    const p = audio.play();
    if (p && p.catch) {
      p.catch((err) => console.warn(`音檔播放失敗: ${wordObj.word}`, err));
    }
  }

  function preloadNextImage() {
    const next = session.rounds[session.roundIndex + 1];
    if (!next) return;
    new Image().src = `/assets/images/${next.target.word}.webp`;
  }

  function resetPuzzle(target) {
    const puzzle = document.getElementById('puzzle');
    puzzle.innerHTML = '';

    const chars = session.unitsOf(target);
    const addSpacer = () => {
      const spacer = document.createElement('div');
      spacer.className = 'gap-spacer';
      puzzle.appendChild(spacer);
    };

    chars.forEach((ch, i) => {
      if (i === session.blankIndex) {
        if (i > 0) addSpacer();
        const slot = document.createElement('div');
        slot.className = 'letter-slot placeholder';
        slot.id = 'blank-slot';
        sizeUnit(slot, session.blankLen, 'slot');  // 固定取全 session 最長,免得寬度洩題
        puzzle.appendChild(slot);
        if (i < chars.length - 1) addSpacer();
        return;
      }
      const tile = document.createElement('div');
      tile.className = 'letter-tile';
      sizeUnit(tile, ch.length, 'slot');
      paintUnit(tile, ch);
      puzzle.appendChild(tile);
    });

    puzzle.classList.remove('bounce');

    const img = document.getElementById('reveal-image');
    img.removeAttribute('src');
    img.alt = '';  // 留著會在無 src 時顯示破圖 icon
    document.getElementById('reveal-note').textContent = '';

    // 圖片只在進場時滑入。退場若也跟著滑,翻頁過程會看到它往下溜過去
    const reveal = document.getElementById('reveal');
    reveal.classList.add('no-anim');
    document.getElementById('stage').classList.remove('solved');
    void reveal.offsetWidth;  // 強制回流,讓歸位在無動畫下完成
    reveal.classList.remove('no-anim');
  }

  function renderOptions(options, target) {
    const row = document.getElementById('options-row');
    row.innerHTML = '';
    row.classList.remove('locked');
    for (const opt of options) {
      const ch = session.keyAt(opt);
      const tile = document.createElement('button');
      tile.className = 'option-tile';
      sizeUnit(tile, ch.length, 'option');
      paintUnit(tile, ch);
      tile.addEventListener('click', () => onOptionClick(opt, target, tile));
      row.appendChild(tile);
    }
  }

  function onOptionClick(opt, target, tileEl) {
    if (solved) return;
    if (opt.word !== target.word) {
      playWord(opt);
      tileEl.classList.remove('fade-wrong');
      void tileEl.offsetWidth;
      tileEl.classList.add('fade-wrong');
      return;
    }
    handleCorrect(opt, tileEl);
  }

  function handleCorrect(opt, tileEl) {
    solved = true;
    document.getElementById('options-row').classList.add('locked');
    updateNav();
    preloadNextImage();

    tileEl.classList.add('fade-out');

    const ch = session.keyAt(opt);
    const slot = document.getElementById('blank-slot');
    paintUnit(slot, ch);
    slot.classList.remove('placeholder');

    const puzzle = document.getElementById('puzzle');
    const spacers = [...puzzle.querySelectorAll('.gap-spacer')];
    requestAnimationFrame(() => spacers.forEach((s) => s.classList.add('collapsed')));
    if (spacers.length) {
      spacers[0].addEventListener('transitionend', () => {
        puzzle.classList.add('bounce');
        setTimeout(() => puzzle.classList.remove('bounce'), 130);
      }, { once: true });
    }

    let shown = false;
    const token = roundToken;
    const doShowImage = () => {
      if (shown || token !== roundToken) return;
      shown = true;
      showImage(opt);
    };
    playWord(opt, doShowImage);
    setTimeout(doShowImage, 4000);
  }

  function showImage(opt) {
    const img = document.getElementById('reveal-image');
    img.src = `/assets/images/${opt.word}.webp`;
    img.alt = opt.word;
    document.getElementById('reveal-note').textContent = opt.zh || '';
    document.getElementById('stage').classList.add('solved');
  }

  function goToRound(index) {
    if (!session) return;
    if (index < 0 || index >= session.rounds.length) return;
    session.roundIndex = index;
    renderRound();
  }

  function updateNav() {
    const hasSession = !!session;
    document.getElementById('prev-btn').disabled =
      !hasSession || session.roundIndex === 0;
    document.getElementById('next-btn').disabled =
      !hasSession || !solved || session.roundIndex === session.rounds.length - 1;
  }

  function renderRound() {
    solved = false;
    roundToken++;
    const { target, options } = session.rounds[session.roundIndex];
    resetPuzzle(target);
    renderOptions(options, target);
    updateNav();
    playWord(target);
  }

  function startSession(name, stage) {
    const contrast = isContrastStage(stage);
    const rimeMode = isRimeMode(stage, name);
    // 挖 rime 時 target 只限本階段,干擾項可用同 onset 的任何舊字
    let items, pool;
    if (contrast) {
      items = pool = contrastSets.get(name) || [];
    } else if (rimeMode) {
      const onset = name.slice(0, -1);
      pool = words.filter((w) => w.onset === onset && w.stage <= Number(stage));
      items = pool.filter((w) => Number(w.stage) === Number(stage));
    } else {
      items = pool = words.filter((w) => w.family === name && w.stage <= Number(stage));
    }
    if (!items.length || pool.length < 2) return;

    const blankIndex = contrast || rimeMode ? 1 : 0;
    const unitsOf = (w) => letters(w, rimeMode);
    const keyAt = (w) => unitsOf(w)[blankIndex];
    const slotIndex = new Map(shuffle(pool).map((w, i) => [keyAt(w), i]));
    const optionCount = Math.min(4, pool.length);
    const blankLen = Math.max(...pool.map((w) => keyAt(w).length));

    // 選項在此一次抽定,前後翻頁時同一題永遠長得一樣
    const rounds = shuffle(items).map((target) => {
      const others = pool.filter((w) => w.word !== target.word);
      const n = Math.min(optionCount - 1, others.length);
      const tier1 = rimeMode ? [] : onsetComponents(target, others);
      const distractors = rimeMode
        ? rankDistractors(target, others).slice(0, n)
        : [...shuffle(tier1), ...sample(others.filter((w) => !tier1.includes(w)), n)]
            .slice(0, n);
      const options = [target, ...distractors].sort(
        (a, b) => slotIndex.get(keyAt(a)) - slotIndex.get(keyAt(b))
      );
      return { target, options };
    });

    session = { items, pool, blankIndex, unitsOf, keyAt, slotIndex, blankLen, rounds, roundIndex: 0 };
    renderRound();
  }

  document.getElementById('replay-btn').addEventListener('click', () => {
    if (!session) return;
    playWord(session.rounds[session.roundIndex].target);
  });

  document.getElementById('prev-btn').addEventListener('click', () =>
    goToRound(session.roundIndex - 1));
  document.getElementById('next-btn').addEventListener('click', () =>
    goToRound(session.roundIndex + 1));

  window.addEventListener('resize', checkMinHeight);

  async function init() {
    checkMinHeight();
    const res = await fetch('/words.json');
    words = await res.json();
    contrastSets = buildContrastSets();
    buildStageSelect();

    const stageSelect = document.getElementById('stage-select');
    const familySelect = document.getElementById('family-select');

    stageSelect.addEventListener('change', () => {
      buildFamilySelect(stageSelect.value);
      startSession(familySelect.value, stageSelect.value);
    });
    familySelect.addEventListener('change', () =>
      startSession(familySelect.value, stageSelect.value));

    buildFamilySelect(stageSelect.value);
    if (familySelect.value) startSession(familySelect.value, stageSelect.value);
  }

  init();
</script>
</body>
</html>
